name: guestbook-sync

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guestbook-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull new messages
        run: python3 scripts/sync_guestbook.py
      - name: Commit
        run: |
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "guestbook-bot"
          git config user.email "guestbook-bot@users.noreply.github.com"
          git add guestbook.json
          git commit -m "방명록 동기화"
          git push
