<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>참석 회신 완료 · 화성 PET 선별센터 준공식</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500&display=swap">
<style>
  :root{ --paper:#F7F8F3; --card:#FDFDFA; --ink:#21332B; --pine:#2E6B52; --pine-deep:#24543F; --brass:#A98C5C; --mist:#6C7C72; --line:#D8DDD2; }
  *{ box-sizing:border-box; }
  body{ margin:0; min-height:100vh; background:var(--paper); color:var(--ink);
    font-family:"Gowun Batang","Nanum Myeongjo",serif; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ background:var(--card); border:1px solid var(--line); outline:1px solid rgba(169,140,92,.45); outline-offset:-9px;
    max-width:420px; width:100%; text-align:center; padding:56px 34px; }
  .check{ width:56px; height:56px; margin:0 auto 22px; }
  h1{ font-family:"Nanum Myeongjo",serif; font-weight:800; font-size:26px; letter-spacing:.02em; margin:0 0 14px; }
  p{ font-size:16px; color:#33473D; line-height:1.85; margin:0 0 8px; }
  .sub{ font-family:"Noto Sans KR",sans-serif; font-size:13.5px; color:var(--mist); margin-top:18px; letter-spacing:.02em; }
  .meta{ margin-top:28px; padding-top:22px; border-top:1px dashed var(--line); font-family:"Noto Sans KR",sans-serif; font-size:13.5px; color:var(--mist); line-height:1.9; }
  .meta b{ color:var(--ink); font-weight:700; }
  a.back{ display:inline-block; margin-top:24px; font-family:"Noto Sans KR",sans-serif; font-size:13px; color:var(--pine-deep); text-decoration:none; border:1px solid #C4CBBE; border-radius:999px; padding:10px 22px; }
</style>
</head>
<body>
  <div class="card">
    <svg class="check" viewBox="0 0 56 56" fill="none" aria-hidden="true">
      <circle cx="28" cy="28" r="26" stroke="#2E6B52" stroke-width="1.6"/>
      <path d="M18 28.5 L25 35.5 L39 21" stroke="#2E6B52" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <h1>참석 의사가<br>전달되었습니다</h1>
    <p>귀한 걸음 감사드립니다.<br>준공식에서 뵙겠습니다.</p>
    <div class="meta">
      <b>화성 PET 선별센터 준공식</b><br>
      2026. 9. 19 (토) 오전 11시<br>
      경기도 화성시 양감면 송산리 519-3
    </div>
    <a class="back" href="https://inobus-jake.github.io/pet-invite/">초대장 다시 보기</a>
    <p class="sub">문의 · 010-9415-4083</p>
  </div>
</body>
</html>
